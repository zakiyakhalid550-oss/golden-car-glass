<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Golden Car Glass</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }
        .card {
            width: 100%;
            max-width: 400px;
            padding: 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,.10);
        }
        h2 { text-align: center; color: #111827; }
        p { text-align: center; color: #555; line-height: 1.5; }
        input {
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 5px;
        }
        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        a {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #111827;
        }
        .messages { color: #b91c1c; text-align: center; }
    </style>
</head>
<body>
    <main class="card">
        <h2>Verify OTP</h2>
        <p>Enter the 6-digit OTP sent to your registered email address.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="messages">
                    {% for category, message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('verify_reset_otp') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input
                type="text"
                name="otp"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                minlength="6"
                placeholder="6-digit OTP"
                autocomplete="one-time-code"
                required
            >
            <button type="submit">Verify OTP</button>
        </form>

        <a href="{{ url_for('forgot_password') }}">Request a new OTP</a>
    </main>
</body>
</html>
