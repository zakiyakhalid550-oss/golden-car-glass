<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Change Password - Golden Car Glass</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            color: #222;
        }


        /* =========================
           HEADER
        ========================= */

        .header {

            background: #111;

            color: white;

            padding: 18px 20px;

            text-align: center;
        }


        .header h1 {

            margin: 0;

            font-size: 24px;
        }


        .header p {

            margin: 6px 0 0;

            color: #c99a00;

            font-size: 14px;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            max-width: 500px;

            margin: 30px auto;

            padding: 0 18px;
        }


        .card {

            background: white;

            border-radius: 12px;

            padding: 25px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.08);
        }


        .card h2 {

            margin-top: 0;

            margin-bottom: 22px;

            font-size: 21px;
        }


        /* =========================
           FLASH MESSAGE
        ========================= */

        .message {

            padding: 11px 12px;

            border-radius: 7px;

            margin-bottom: 18px;

            font-size: 14px;
        }


        .message.success {

            background: #e8f5e9;

            color: #2e7d32;

            border: 1px solid #a5d6a7;
        }


        .message.error {

            background: #ffebee;

            color: #c62828;

            border: 1px solid #ef9a9a;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: bold;
        }


        /* =========================
           PASSWORD WRAPPER
        ========================= */

        .password-wrapper {

            position: relative;

            width: 100%;
        }


        .password-wrapper input {

            width: 100%;

            padding:
                12px
                50px
                12px
                12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }


        .password-wrapper input:focus {

            border-color: #c99a00;
        }


        /* =========================
           LOCK BUTTON
        ========================= */

        .toggle-password {

            position: absolute;

            right: 8px;

            top: 50%;

            transform:
                translateY(-50%);

            width: 38px;

            height: 38px;

            border: none;

            background: transparent;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;
        }


        .toggle-password:hover {

            background: transparent;
        }


        .lock-icon {

            width: 23px;

            height: 23px;

            stroke: #c99a00;

            stroke-width: 2;

            stroke-linecap: round;

            stroke-linejoin: round;

            fill: none;

            transition: 0.2s ease;
        }


        .toggle-password:hover
        .lock-icon {

            stroke: #ad8200;

            transform: scale(1.08);
        }


        /* =========================
           CHANGE PASSWORD BUTTON
        ========================= */

        .change-button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #c99a00;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .change-button:hover {

            background: #ad8200;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {

            display: block;

            width: 100%;

            margin-top: 12px;

            padding: 11px;

            border-radius: 8px;

            background: #111;

            color: white;

            text-align: center;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;
        }


        .back-button:hover {

            background: #333;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .container {

                margin-top: 20px;

                padding:
                    0 12px;
            }


            .card {

                padding:
                    20px 16px;
            }


            .header h1 {

                font-size: 21px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h1>
            Golden Car Glass
        </h1>

        <p>
            Change Password
        </p>

    </div>


    <!-- =========================
         MAIN CONTAINER
    ========================= -->

    <div class="container">

        <div class="card">


            <h2>
                Change Password
            </h2>


            <!-- =========================
                 FLASH MESSAGES
            ========================= -->

            {% with messages =
                get_flashed_messages(
                    with_categories=true
                )
            %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="message {{ category }}">

                            {{ message }}

                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- =========================
                 PASSWORD FORM
            ========================= -->

            <form
                method="POST"
                action="{{ url_for('change_admin_password') }}"
            >


                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >


                <!-- CURRENT PASSWORD -->

                <div class="form-group">

                    <label for="current_password">

                        Current Password

                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="current_password"
                            name="current_password"
                            placeholder="Enter current password"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            id="toggleCurrentPassword"
                            aria-label="Show password"
                            title="Show password"
                        >

                            <svg
                                class="lock-icon"
                                id="currentLockIcon"
                                viewBox="0 0 24 24"
                            >

                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="10"
                                    rx="2"
                                ></rect>

                                <path
                                    d="M7 10V7a5 5 0 0 1 10 0v3"
                                ></path>

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label for="new_password">

                        New Password

                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="new_password"
                            name="new_password"
                            placeholder="Enter new password"
                            minlength="8"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            id="toggleNewPassword"
                            aria-label="Show password"
                            title="Show password"
                        >

                            <svg
                                class="lock-icon"
                                id="newLockIcon"
                                viewBox="0 0 24 24"
                            >

                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="10"
                                    rx="2"
                                ></rect>

                                <path
                                    d="M7 10V7a5 5 0 0 1 10 0v3"
                                ></path>

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirm_password">

                        Confirm New Password

                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm new password"
                            minlength="8"
                            required
                        >


                        <button
                            type="button"
                            class="toggle-password"
                            id="toggleConfirmPassword"
                            aria-label="Show password"
                            title="Show password"
                        >

                            <svg
                                class="lock-icon"
                                id="confirmLockIcon"
                                viewBox="0 0 24 24"
                            >

                                <rect
                                    x="5"
                                    y="10"
                                    width="14"
                                    height="10"
                                    rx="2"
                                ></rect>

                                <path
                                    d="M7 10V7a5 5 0 0 1 10 0v3"
                                ></path>

                            </svg>

                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="change-button"
                >

                    Change Password

                </button>


            </form>


            <!-- =========================
                 BACK TO PROFILE
            ========================= -->

            <a
                href="{{ url_for('admin_profile') }}"
                class="back-button"
            >

                Back to Admin Profile

            </a>


        </div>

    </div>


    <!-- =========================
         PASSWORD SHOW / HIDE
    ========================= -->

    <script>


        function setupPasswordToggle(

            inputId,

            buttonId,

            iconId

        ) {


            const passwordInput =
                document.getElementById(
                    inputId
                );


            const togglePassword =
                document.getElementById(
                    buttonId
                );


            const lockIcon =
                document.getElementById(
                    iconId
                );


            togglePassword.addEventListener(

                "click",

                function () {


                    if (
                        passwordInput.type ===
                        "password"
                    ) {


                        /* SHOW PASSWORD */

                        passwordInput.type =
                            "text";


                        /* UNLOCK ICON */

                        lockIcon.innerHTML = `

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2"
                            ></rect>

                            <path
                                d="M8 10V7a4 4 0 0 1 6.8-2.8"
                            ></path>

                        `;


                        togglePassword.setAttribute(

                            "aria-label",

                            "Hide password"

                        );


                        togglePassword.setAttribute(

                            "title",

                            "Hide password"

                        );


                    }

                    else {


                        /* HIDE PASSWORD */

                        passwordInput.type =
                            "password";


                        /* LOCK ICON */

                        lockIcon.innerHTML = `

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2"
                            ></rect>

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            ></path>

                        `;


                        togglePassword.setAttribute(

                            "aria-label",

                            "Show password"

                        );


                        togglePassword.setAttribute(

                            "title",

                            "Show password"

                        );

                    }

                }

            );

        }


        /* =========================
           ACTIVATE TOGGLES
        ========================= */


        setupPasswordToggle(

            "current_password",

            "toggleCurrentPassword",

            "currentLockIcon"

        );


        setupPasswordToggle(

            "new_password",

            "toggleNewPassword",

            "newLockIcon"

        );


        setupPasswordToggle(

            "confirm_password",

            "toggleConfirmPassword",

            "confirmLockIcon"

        );


    </script>


</body>

</html>
