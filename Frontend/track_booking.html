<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Booking - Golden Car Glass</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 50px 20px;
            background-color: #f4f4f4;
        }

        .track-container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            color: #c99a00;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        .booking-input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .track-btn {
            width: 100%;
            padding: 13px;
            background-color: #c99a00;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .track-btn:hover {
            background-color: #ad8200;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            background-color: #222;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
        }

        .back-btn:hover {
            background-color: #444;
        }

    </style>

</head>

<body>

    <div class="track-container">

        <h1>🚗 Track Your Booking</h1>

        <p>
            Enter your Booking Reference Number
        </p>

        <form action="/track_booking" method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <input
                type="number"
                name="booking_id"
                class="booking-input"
                placeholder="Enter Booking Reference"
                required
                min="1"
            >

            <button
                type="submit"
                class="track-btn"
            >
                🔍 Track Booking
            </button>

        </form>

        <a href="/" class="back-btn">
            🏠 Back to Home
        </a>

    </div>

</body>

</html>
