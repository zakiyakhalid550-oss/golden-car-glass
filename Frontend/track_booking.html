<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Track Booking - Golden Car Glass</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            min-height: 100vh;
        }


        /* =========================
           NAVBAR
        ========================== */

        nav {
            background: #111;
            color: white;

            padding: 20px 50px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;
        }

        nav h2 {
            color: #f5c518;
            white-space: nowrap;
            font-size: 24px;
        }

        nav div {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        nav a:hover {
            color: #f5c518;
        }


        /* =========================
           TRACK SECTION
        ========================== */

        .track-section {
            min-height: calc(100vh - 80px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }


        /* =========================
           TRACK BOX
        ========================== */

        .track-box {
            background: white;

            width: 100%;
            max-width: 550px;

            padding: 40px 35px;

            border-radius: 14px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.10);

            text-align: center;
        }


        .track-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }


        .track-box h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }


        .track-subtitle {
            color: #666;

            font-size: 16px;

            line-height: 1.5;

            margin-bottom: 30px;
        }


        /* =========================
           FORM
        ========================== */

        .track-form {
            display: flex;
            flex-direction: column;

            gap: 15px;
        }


        .track-form input {
            width: 100%;

            padding: 15px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-family: Arial, sans-serif;

            font-size: 16px;

            color: #222;

            background: white;

            outline: none;
        }


        .track-form input:focus {
            border-color: #c99a00;
        }


        .track-form input::placeholder {
            color: #777;

            font-family: Arial, sans-serif;

            font-size: 16px;
        }


        /* =========================
           BUTTON
        ========================== */

        .track-button {
            width: 100%;

            padding: 15px;

            background: #f5c518;

            color: #111;

            border: none;

            border-radius: 8px;

            font-family: Arial, sans-serif;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .track-button:hover {
            background: #d4a900;
        }


        /* =========================
           ERROR
        ========================== */

        .error-message {
            margin-top: 18px;

            padding: 12px;

            background: #ffe5e5;

            color: #b00020;

            border-radius: 8px;

            font-size: 14px;

            line-height: 1.4;
        }


        /* =========================
           HOME LINK
        ========================== */

        .home-link {
            display: inline-block;

            margin-top: 25px;

            color: #222;

            text-decoration: none;

            font-size: 14px;
        }


        .home-link:hover {
            color: #c99a00;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 768px) {

            nav {
                padding: 15px 18px;

                flex-direction: column;

                text-align: center;

                gap: 10px;
            }


            nav h2 {
                font-size: 21px;
            }


            nav div {
                gap: 8px 14px;

                justify-content: center;

                flex-wrap: wrap;
            }


            nav a {
                font-size: 13px;
            }


            .track-section {
                min-height: calc(100vh - 110px);

                padding: 30px 15px;
            }


            .track-box {
                padding: 30px 20px;

                border-radius: 12px;
            }


            .track-icon {
                font-size: 45px;
            }


            .track-box h1 {
                font-size: 28px;
            }


            .track-subtitle {
                font-size: 15px;

                margin-bottom: 25px;
            }


            .track-form input {
                padding: 14px;

                font-size: 15px;
            }


            .track-form input::placeholder {
                font-size: 15px;
            }


            .track-button {
                padding: 14px;

                font-size: 15px;
            }

        }


        /* =========================
           SMALL MOBILE
        ========================== */

        @media (max-width: 420px) {

            nav {
                padding: 14px 10px;
            }


            nav h2 {
                font-size: 20px;
            }


            nav div {
                gap: 7px 10px;
            }


            nav a {
                font-size: 12px;
            }


            .track-section {
                padding-left: 10px;
                padding-right: 10px;
            }


            .track-box {
                padding: 27px 17px;
            }


            .track-box h1 {
                font-size: 25px;
            }


            .track-subtitle {
                font-size: 14px;
            }


            .track-form input {
                font-size: 14px;
            }


            .track-form input::placeholder {
                font-size: 14px;
            }


            .track-button {
                font-size: 14px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav>

        <h2>
            Golden Car Glass
        </h2>

        <div>

            <a href="/">
                Home
            </a>

            <a href="/#services">
                Services
            </a>

            <a href="/#booking">
                Book a Service
            </a>

        </div>

    </nav>


    <!-- =========================
         TRACK BOOKING
    ========================== -->

    <section class="track-section">

        <div class="track-box">

            <div class="track-icon">
                🔎
            </div>


            <h1>
                Track Your Booking
            </h1>


            <p class="track-subtitle">
                Enter your Booking Reference Number
                to check your booking status.
            </p>


            <form
                action="/track_booking"
                method="POST"
                class="track-form"
            >

                <!-- CSRF -->

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >


                <!-- Booking Number -->

                <input
                    type="number"
                    name="booking_id"
                    placeholder="Enter Booking No."
                    min="1"
                    required
                >


                <!-- Track Button -->

                <button
                    type="submit"
                    class="track-button"
                >
                    Track Booking
                </button>

            </form>


            <!-- ERROR MESSAGE -->

            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}


            <!-- HOME -->

            <a
                href="/"
                class="home-link"
            >
                🏠 Back to Home
            </a>

        </div>

    </section>


</body>

</html>
