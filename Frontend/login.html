<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Golden Car Glass</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-size: 28px;
            color: #c99a00;
        }

        .logo p {
            margin-top: 8px;
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        /* =========================
           USERNAME SUGGESTIONS
        ========================= */

        .username-wrapper {
            position: relative;
        }

        .username-wrapper input {
            width: 100%;
        }

        .username-suggestions {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            width: 100%;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.10);
            z-index: 1000;
            overflow: hidden;
        }

        .username-suggestion {
            padding: 11px 13px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
        }

        .username-suggestion:last-child {
            border-bottom: none;
        }

        .username-suggestion:hover {
            background: #fff8df;
            color: #ad8200;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #c99a00;
        }

        /* =========================
           PASSWORD FIELD
        ========================= */

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 52px;
        }

        .toggle-password {
            position: absolute;
            right: 7px;
            top: 50%;
            transform: translateY(-50%);

            width: 38px;
            height: 38px;

            padding: 0;
            border: none;
            background: transparent;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        .toggle-password:hover {
            background: transparent;
        }

        .lock-icon {
            width: 23px;
            height: 23px;
            stroke: #c99a00;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;

            transition: 0.2s ease;
        }

        .toggle-password:hover .lock-icon {
            stroke: #ad8200;
            transform: scale(1.08);
        }

        /* =========================
           LOGIN BUTTON
        ========================= */

        button.login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #c99a00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button.login-button:hover {
            background: #ad8200;
        }

        /* =========================
           BACK HOME
        ========================= */

        .back-home {
            text-align: center;
            margin-top: 18px;
        }

        .back-home a {
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home a:hover {
            color: #c99a00;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <h1>Golden Car Glass</h1>
            <p>Admin Login</p>
        </div>

        <form method="POST" action="/login">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <!-- =========================
                 USERNAME
            ========================== -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <div class="username-wrapper">

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter admin username"
                        required
                        autocomplete="off"
                    >

                    <div
                        id="usernameSuggestions"
                        class="username-suggestions"
                    ></div>

                </div>

            </div>


            <!-- =========================
                 PASSWORD
            ========================== -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        required
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Show password"
                        title="Show password"
                    >

                        <svg
                            id="lockIcon"
                            class="lock-icon"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                        >

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2"
                            ></rect>

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            ></path>

                        </svg>

                    </button>

                </div>

            </div>


            <!-- =========================
                 LOGIN
            ========================== -->

            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>


        <div class="back-home">
            <a href="/">
                ← Back to Home
            </a>
        </div>

    </div>


<script>

    // ==========================================
    // ELEMENTS
    // ==========================================

    const usernameInput =
        document.getElementById("username");

    const usernameSuggestions =
        document.getElementById("usernameSuggestions");

    const loginForm =
        document.querySelector("form");

    const passwordInput =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");

    const lockIcon =
        document.getElementById("lockIcon");


    // ==========================================
    // USERNAME STORAGE
    // ==========================================

    let savedUsernames =
        JSON.parse(
            localStorage.getItem(
                "goldenCarGlassUsernames"
            )
        ) || [];


    // ==========================================
    // SHOW USERNAME SUGGESTIONS
    // ==========================================

    usernameInput.addEventListener(
        "input",
        function () {

            const typedText =
                usernameInput.value
                    .trim()
                    .toLowerCase();

            usernameSuggestions.innerHTML = "";

            if (typedText.length === 0) {

                usernameSuggestions.style.display =
                    "none";

                return;
            }


            const matchingUsernames =
                savedUsernames.filter(
                    function (username) {

                        return username
                            .toLowerCase()
                            .startsWith(typedText);

                    }
                );


            if (matchingUsernames.length === 0) {

                usernameSuggestions.style.display =
                    "none";

                return;
            }


            matchingUsernames.forEach(
                function (username) {

                    const suggestion =
                        document.createElement("div");

                    suggestion.className =
                        "username-suggestion";

                    suggestion.textContent =
                        username;


                    suggestion.addEventListener(
                        "click",
                        function () {

                            usernameInput.value =
                                username;

                            usernameSuggestions.style.display =
                                "none";

                        }
                    );


                    usernameSuggestions.appendChild(
                        suggestion
                    );

                }
            );


            usernameSuggestions.style.display =
                "block";

        }
    );


    // ==========================================
    // CLOSE SUGGESTIONS WHEN CLICKING OUTSIDE
    // ==========================================

    document.addEventListener(
        "click",
        function (event) {

            if (
                !event.target.closest(
                    ".username-wrapper"
                )
            ) {

                usernameSuggestions.style.display =
                    "none";

            }

        }
    );


    // ==========================================
    // PASSWORD SHOW / HIDE
    // ==========================================

    togglePassword.addEventListener(
        "click",
        function () {

            if (
                passwordInput.type === "password"
            ) {

                // Show password
                passwordInput.type = "text";


                // UNLOCK ICON
                lockIcon.innerHTML = `
                    <rect
                        x="5"
                        y="10"
                        width="14"
                        height="10"
                        rx="2"
                    ></rect>

                    <path
                        d="M8 10V7a4 4 0 0 1 6.8-2.8"
                    ></path>
                `;


                togglePassword.setAttribute(
                    "aria-label",
                    "Hide password"
                );

                togglePassword.setAttribute(
                    "title",
                    "Hide password"
                );

            } else {

                // Hide password
                passwordInput.type = "password";


                // LOCK ICON
                lockIcon.innerHTML = `
                    <rect
                        x="5"
                        y="10"
                        width="14"
                        height="10"
                        rx="2"
                    ></rect>

                    <path
                        d="M8 10V7a4 4 0 0 1 8 0v3"
                    ></path>
                `;


                togglePassword.setAttribute(
                    "aria-label",
                    "Show password"
                );

                togglePassword.setAttribute(
                    "title",
                    "Show password"
                );

            }

        }
    );


    // ==========================================
    // SAVE USERNAME AFTER LOGIN
    // ==========================================

    loginForm.addEventListener(
        "submit",
        function () {

            const username =
                usernameInput.value.trim();


            if (username !== "") {

                // Duplicate username avoid karo
                const alreadyExists =
                    savedUsernames.some(
                        function (savedUsername) {

                            return savedUsername
                                .toLowerCase() ===
                                username.toLowerCase();

                        }
                    );


                if (!alreadyExists) {

                    savedUsernames.push(username);

                    localStorage.setItem(
                        "goldenCarGlassUsernames",
                        JSON.stringify(
                            savedUsernames
                        )
                    );

                }

            }

        }
    );

</script>

</body>
</html>
