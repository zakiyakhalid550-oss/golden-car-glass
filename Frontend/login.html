<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Golden Car Glass</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            font-size: 28px;
            color: #c99a00;
        }

        .logo p {
            margin-top: 8px;
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #c99a00;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #c99a00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ad8200;
        }

        .back-home {
            text-align: center;
            margin-top: 18px;
        }

        .back-home a {
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home a:hover {
            color: #c99a00;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <h1>Golden Car Glass</h1>
            <p>Admin Login</p>
        </div>

        <form method="POST" action="/login">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="back-home">
            <a href="/">← Back to Home</a>
        </div>

    </div>

<script>
    const usernameInput = document.getElementById("username");
    const loginForm = document.querySelector("form");

    // Saved username automatically fill karo
    const savedUsername = localStorage.getItem("goldenCarGlassUsername");

    if (savedUsername) {
        usernameInput.value = savedUsername;
    }

    // Login ke time username save karo
    loginForm.addEventListener("submit", function () {

        if (usernameInput.value.trim() !== "") {
            localStorage.setItem(
                "goldenCarGlassUsername",
                usernameInput.value.trim()
            );
        }

    });
</script>

</body>
</html>
